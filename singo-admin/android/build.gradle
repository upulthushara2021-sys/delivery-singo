// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

def localBuildRoot = new File(System.getProperty('java.io.tmpdir'), 'singo-android-build')

allprojects {
    buildDir = new File(localBuildRoot, project.name)
    configurations.configureEach {
        resolutionStrategy.force(
            'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        )
    }
    repositories {
        google()
        mavenCentral()
    }
    tasks.matching { it.name == 'preBuild' }.configureEach { preBuildTask ->
        preBuildTask.doFirst {
            delete rootProject.file("capacitor-cordova-android-plugins/src/main/res/.gitkeep")
            delete rootProject.file("capacitor-cordova-android-plugins/src/main/java/.gitkeep")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
